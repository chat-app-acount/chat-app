<!doctype html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7a6d">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChatSpace">
<title>ChatSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0ee;--panel:#f8faf9;--ink:#16221f;--sub:#6b7d78;--line:#d5dfdb;
  --accent:#0e7a6d;--accent-ink:#fff;--mine:#0e7a6d;--mine-ink:#fff;--other:#fff;--hover:#e0e9e6;--danger:#c2410c;
}
@media(prefers-color-scheme:dark){
  :root[data-theme="auto"]{--bg:#0c1211;--panel:#121b19;--ink:#e3efec;--sub:#8aa19b;--line:#223330;--accent:#34b8a6;--accent-ink:#06211d;--mine:#17705f;--mine-ink:#fff;--other:#1a2624;--hover:#182421;--danger:#fb923c}
}
:root[data-theme="dark"]{--bg:#0c1211;--panel:#121b19;--ink:#e3efec;--sub:#8aa19b;--line:#223330;--accent:#34b8a6;--accent-ink:#06211d;--mine:#17705f;--mine-ink:#fff;--other:#1a2624;--hover:#182421;--danger:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.field{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none}
.field:focus{border-color:var(--accent)}

/* login */
.login{height:100dvh;display:grid;place-items:center;padding:20px;overflow:auto}
.login-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px 26px;display:grid;gap:14px}
.wordmark{font-size:30px;font-weight:700;letter-spacing:.02em}
.wordmark i{font-style:normal;color:var(--accent)}
.login-card p.lead{color:var(--sub);margin-top:-6px}
.login-card .err{color:var(--danger);font-size:13px;min-height:18px}
.sep{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.linklike{color:var(--accent);font-weight:700;text-align:center}
.setup{max-width:640px;margin:8vh auto;padding:0 20px;overflow:auto;height:84dvh}
.setup code,.setup pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:13px}
.setup pre{display:block;padding:12px;overflow:auto;margin:8px 0 16px}

/* shell */
.shell{display:grid;grid-template-columns:330px 1fr;height:100dvh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;gap:6px;padding:14px 12px 10px 18px}
.side-head .wordmark{font-size:22px;flex:1}
.side-actions{display:flex;gap:8px;padding:0 14px 12px}
.side-actions .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;font-size:14px}
.room-list{flex:1;overflow-y:auto;padding:4px 8px 12px}
.room{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;width:100%;text-align:left}
.room:hover{background:var(--hover)}
.room.active{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.room .meta{flex:1;min-width:0}
.room .top{display:flex;gap:8px;align-items:baseline}
.room .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.room .time{font-size:12px;color:var(--sub);flex:none}
.room .last{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room.unread .last{color:var(--ink);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none;position:relative}
.avatar.sm{width:34px;height:34px;font-size:14px}
.avatar .on{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid var(--panel)}
.empty{color:var(--sub);text-align:center;padding:40px 20px;font-size:14px}

.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.chat-head .back{display:none}
.chat-head .titles{flex:1;min-width:0}
.chat-head .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.chat-head .s.typing{color:var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.hint{position:absolute;inset:60px 0 70px 0;display:grid;place-items:center;color:var(--sub);pointer-events:none;text-align:center;padding:20px}
.welcome{flex:1;display:grid;place-items:center;color:var(--sub);text-align:center;padding:20px}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:min(78%,560px)}
.msg.mine{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;color:var(--sub);margin:0 6px 2px}
.bubble{background:var(--other);padding:8px 13px;border-radius:18px 18px 18px 6px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;cursor:pointer;border:1px solid var(--line)}
.msg.mine .bubble{background:var(--mine);color:var(--mine-ink);border-color:transparent;border-radius:18px 18px 6px 18px}
.bubble a{color:inherit;text-decoration:underline}
.bubble.stamp{background:none;border:0;font-size:56px;line-height:1.15;padding:0 2px}
.info{font-size:11px;color:var(--sub);margin:2px 6px 0;display:flex;gap:8px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 8px;font-size:13px;line-height:24px}
.chip.on{border-color:var(--accent);background:var(--hover)}
.bar{display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin-top:4px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.msg.open .bar{display:flex}
.bar button{width:32px;height:32px;border-radius:50%;font-size:17px;display:grid;place-items:center}
.bar button:hover{background:var(--hover)}
.bar .del{color:var(--danger)}

.composer{position:relative;display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;max-height:140px;min-height:42px;padding:10px 14px;border-radius:21px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:16px;line-height:1.45}
.composer textarea:focus{border-color:var(--accent)}
.send{background:var(--accent);color:var(--accent-ink)}
.send:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
.send:disabled{opacity:.45}
.stamps{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;flex-direction:column;max-width:420px;max-height:min(340px,50dvh)}
.stamps.show{display:flex}
.stab{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.stab button{padding:4px 12px;border-radius:999px;font-size:13px;white-space:nowrap;color:var(--sub)}
.stab button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:2px;padding:8px;overflow-y:auto}
.sgrid button{font-size:30px;line-height:1;padding:8px 0;border-radius:12px}
.sgrid button:hover{background:var(--hover)}

/* modal / popup / toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(420px,100%);max-height:86dvh;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;padding:14px 12px 6px 20px;font-weight:700;font-size:17px}
.modal-h span:first-child{flex:1}
.modal-b{padding:8px 20px 20px;display:grid;gap:12px;overflow-y:auto}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.tabs button{flex:1;padding:7px;border-radius:999px;font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.urow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;width:100%;text-align:left}
.urow:hover{background:var(--hover)}
.urow .n{flex:1;min-width:0}
.urow .n small{display:block;color:var(--sub);font-size:12px}
.popup{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;min-width:220px}
.popup button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.popup button:hover{background:var(--hover)}
.popup .danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:70;font-size:14px;max-width:90vw}
.codebox{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;letter-spacing:.15em;justify-content:space-between}

@media(max-width:760px){
  .shell{display:block;position:relative}
  .side,.main{position:absolute;inset:0;width:100%}
  .main{transform:translateX(100%);transition:transform .22s ease;z-index:5}
  body.in-chat .main{transform:none}
  .chat-head .back{display:inline-flex}
  .msg{max-width:86%}
}
@media(prefers-reduced-motion:reduce){.main{transition:none}}

.composer{flex-direction:column;align-items:stretch;gap:6px}
.crow{display:flex;align-items:flex-end;gap:8px}
.replybar{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;border-left:3px solid var(--accent);background:var(--bg);border-radius:8px;font-size:13px;color:var(--sub)}
.replybar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sys{align-self:center;font-size:12px;color:var(--sub);background:var(--hover);padding:2px 12px;border-radius:999px;margin:6px 0;text-align:center}
.quote{font-size:12px;border-left:3px solid var(--accent);padding:1px 8px;margin:0 4px 3px;color:var(--sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.deleted{font-style:italic;color:var(--sub);background:transparent;border-style:dashed;cursor:default}
.msg.mine .bubble.deleted{color:var(--sub)}
.pinbar{display:flex;gap:8px;align-items:center;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--sub);cursor:pointer}
.pinbar span:last-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.flash .bubble{animation:flash 1.6s}
@keyframes flash{0%,50%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.bar{flex-wrap:wrap;max-width:280px;border-radius:18px}
.msg.mine .bar{justify-content:flex-end}
.bar .sp{width:1px;background:var(--line);margin:4px 3px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;padding:2px 12px 10px}
.filters button{min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 7px;border:1px solid var(--line);border-radius:11px;background:var(--bg);font-size:12px;color:var(--sub);white-space:nowrap;transition:background .15s,border-color .15s}
.filters button .ico{width:15px;height:15px;flex:none}
.filters button .fc{font-weight:700;font-variant-numeric:tabular-nums}
.filters button.on{background:var(--hover);border-color:var(--accent);color:var(--ink);font-weight:700}
.filters button.explore{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding-inline:11px}
.filters button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:380px){.filters{grid-template-columns:repeat(3,minmax(0,1fr));}.filters button.explore{grid-column:1/-1}}
.side-tools{padding:2px 12px 12px;display:grid;gap:9px}
.side-tools-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-tools-head strong{font-size:13px;letter-spacing:.02em}
.side-tools-head span{font-size:11px;color:var(--sub)}
.room-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 11px;min-height:40px}
.room-search .ico{color:var(--sub);flex:none}
.room-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13px}
.room-search input::placeholder{color:var(--sub)}
.room-tool-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.room-tool-row button{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--sub);font-size:12px}
.room-tool-row button.on{background:var(--hover);border-color:var(--accent);color:var(--ink);font-weight:700}
.room-tool-row .hint{font-size:11px;color:var(--sub)}


.discover-body{display:grid;gap:16px}
.discover-intro{display:grid;gap:3px;padding:4px 2px 8px}
.discover-intro b{font-size:15px}
.discover-intro span{font-size:12px;color:var(--sub)}
.discover-section{display:grid;gap:8px}
.discover-label{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--sub);padding:0 2px}
.discover-card{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--bg);text-align:left;transition:transform .15s,border-color .15s,background .15s}
.discover-card:hover{border-color:var(--accent);background:var(--hover);transform:translateY(-1px)}
.discover-icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:13px;background:var(--hover);color:var(--accent)}
.discover-copy{display:grid;gap:2px;flex:1;min-width:0}
.discover-copy b{font-size:14px}
.discover-copy small{font-size:11px;color:var(--sub);line-height:1.45}
.discover-tag{font-size:10px;font-weight:700;color:var(--sub);border:1px solid var(--line);padding:4px 7px;border-radius:999px;white-space:nowrap}
.discover-card.official{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.discover-card.official .discover-icon{background:var(--accent);color:var(--accent-ink)}
.discover-card.official .discover-tag{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.support-hero{display:flex;gap:12px;align-items:center;padding:13px;border-radius:15px;background:var(--hover)}
.support-mark{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.support-hero p{font-size:12px;color:var(--sub);margin-top:3px}
.support-label{font-size:12px;font-weight:700;margin-bottom:-8px}
.support-history-head{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.support-history-head .linklike{font-size:12px}
.support-history-item{display:grid;gap:5px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.support-history-top{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.support-history-top span{color:var(--accent);font-weight:700;white-space:nowrap}
.support-history-text{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.support-history-item small{font-size:10px;color:var(--sub)}
.support-reply{font-size:12px;padding:8px;border-radius:9px;background:var(--hover);white-space:pre-wrap;overflow-wrap:anywhere}

.ver{font-size:11px;color:var(--sub);text-align:center;padding:6px 0 10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.hit{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px}
.hit:hover{background:var(--hover)}
.hit small{display:block;color:var(--sub);font-size:12px}
.hit div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
.side-head .logo{margin-right:2px}
.side-head .wordmark{flex:1}
.login-card .logo{margin-bottom:-4px}
.nbanner{display:flex;gap:10px;align-items:center;margin:0 12px 8px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--hover);font-size:13px}
.nbanner span{flex:1;min-width:0}
.nbanner .btn{padding:6px 12px;font-size:13px;white-space:nowrap}
.bubble.imgb{padding:3px;background:var(--other);border:1px solid var(--line)}
.msg.mine .bubble.imgb{background:var(--mine)}
.pic{display:block;max-width:min(260px,100%);max-height:360px;border-radius:15px;cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:80;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.lb img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform;touch-action:none;-webkit-user-drag:none}
.lb-bar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:6px;z-index:2}
.lb-bar button,.lb-bar a{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;line-height:1}
.lb-bar button:hover,.lb-bar a:hover{background:rgba(255,255,255,.26)}
.lb-note{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:999px;font-size:12px;z-index:2}
.imore{color:var(--sub);line-height:1;padding:0 4px;display:inline-flex;align-items:center}
.callov{position:fixed;inset:0;background:rgba(8,18,16,.97);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:90;padding:24px;text-align:center}
.callov .avatar{width:104px;height:104px;font-size:44px;margin-bottom:6px}
.callov .cname{font-size:24px;font-weight:700}
.callov .cstat{color:rgba(255,255,255,.7);min-height:24px}
.cbtns{display:flex;gap:34px;margin-top:34px}
.cbtn{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.cbtn.on{background:#fff;color:#111}
.cbtn.red{background:#dc2626}.cbtn.green{background:#16a34a}
.cbtn.red .ico{transform:rotate(135deg)}
.gl{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:440px;margin-top:6px}
.gl .gp{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;width:88px;overflow:hidden}
.callov .gl .avatar{width:58px;height:58px;font-size:24px;margin:0}

/* ---------- listeners ---------- */
function listenUsers(){
  unsubUsers = onSnapshot(collection(db,'users'), snap => {
    users = {}; snap.forEach(d => users[d.id] = d.data());
    if (me && users[me.uid]?.banned){ alert('このアカウントは管理者により利用停止されています'); auth.signOut(); return; }
    renderRooms(); renderHeader();
  }, e => console.error('users', e));
}
function listenRooms(){
  const bucket = {rooms:{}, dms:{}}, loaded = {rooms:false, dms:false};
  const watch = col => onSnapshot(query(collection(db,col), where('members','array-contains', me.uid)), snap => {
    const next = {};
    snap.forEach(d => next[d.id] = {id:d.id, col, ...d.data({serverTimestamps:'estimate'})});
    if (loaded[col]) for (const r of Object.values(next)){
      const p = bucket[col][r.id];
      if (p && ms(r.lastMsgTs) > ms(p.lastMsgTs) && r.lastUid && r.lastUid !== me.uid && (!inFocus() || r.id !== cur)) notify(r);
      if (!p && col === 'rooms' && r.createdBy !== me.uid && (r.invited || []).includes(me.uid)) toast('「' + (r.name || 'ルーム') + '」に招待されました');
    }
    bucket[col] = next; loaded[col] = true;
    rooms = {...bucket.rooms, ...bucket.dms};
    callWatch();
    if (cur && !rooms[cur] && loaded.rooms && loaded.dms){ toast('このルームは利用できなくなりました'); closeRoom(); }
    if (cur && rooms[cur]){ readMap[cur] = Date.now(); saveRead(); }
    renderRooms(); renderHeader();
  }, e => { console.error(col, e); toast('一覧を読み込めません（Firestoreのルールを確認してください）'); });
  unsubCols = [watch('rooms'), watch('dms')];
}

function savePrivateUsage(){
  try {
    const key='cs_private_usage_v1', old=JSON.parse(localStorage.getItem(key)||'{}');
    const day=new Date().toLocaleDateString('sv-SE');
    old[day]=(Number(old[day])||0)+Math.max(0,Date.now()-usageStartedAt);
    localStorage.setItem(key,JSON.stringify(old));
    usageStartedAt=Date.now();
  } catch(e){}
}
function privateUsageToday(){
  try {
    const day=new Date().toLocaleDateString('sv-SE');
    const x=JSON.parse(localStorage.getItem('cs_private_usage_v1')||'{}');
    const active=new Date(usageStartedAt).toLocaleDateString('sv-SE')===day ? Math.max(0,Date.now()-usageStartedAt) : 0;
    return (Number(x[day])||0)+active;
  } catch(e){ return 0; }
}
function durationText(msValue){
  const m=Math.floor(msValue/60000), h=Math.floor(m/60);
  return h ? h+'時間'+(m%60)+'分' : m+'分';
}
async function publishDmActivity(statusOverride, onlyRoomId=null){
  if (!me || !Object.keys(rooms).length) return;
  const opts=activityOptions(), nowStatus=statusOverride || (document.hidden?'away':'online');
  const targets=Object.values(rooms).filter(r=>isDm(r) && (r.members||[]).includes(me.uid) && (onlyRoomId === '*' || r.id===onlyRoomId));
  await Promise.all(targets.map(async r=>{
    const jobs=[];
    jobs.push(setDoc(activityRef(r,'presence'),{status:nowStatus,share:opts.status,updatedAt:serverTimestamp()},{merge:true}));
    jobs.push(setDoc(activityRef(r,'devices'),{device:currentActivityDevice(),share:opts.device,updatedAt:serverTimestamp()},{merge:true}));
    const autoLabel = document.hidden ? '離席中' : (document.hasFocus() ? (cur===r.id ? 'DMを利用中' : 'ChatSpaceを利用中') : 'バックグラウンド');
    jobs.push(setDoc(activityRef(r,'activities'),{label:autoLabel,share:opts.label,updatedAt:serverTimestamp()},{merge:true}));
    jobs.push(setDoc(activityRef(r,'lastSeen'),{at:serverTimestamp(),share:opts.lastSeen},{merge:true}));
    await Promise.all(jobs).catch(e=>console.warn('activity publish',e));
  }));
}
function stopDmActivityWatch(){
  dmActivityUnsubs.forEach(fn=>fn()); dmActivityUnsubs=[]; dmActivity={};
}
function watchDmActivity(r){
  stopDmActivityWatch();
  if (!r || !isDm(r)) return;
  const peer=otherUid(r);
  for (const type of activityTypes){
    const unsub=onSnapshot(activityRef(r,type,peer),sn=>{
      dmActivity[type]=sn.exists()?sn.data():null;
      renderHeader();
    },()=>{ dmActivity[type]=null; renderHeader(); });
    dmActivityUnsubs.push(unsub);
  }
}

function dmActivitySummary(){
  const parts=[];
  const p=dmActivity.presence;
  if(p?.share===true){
    const labels={online:'オンライン',away:'離席中',busy:'取り込み中',offline:'オフライン'};
    const stale=p.updatedAt && Date.now()-ms(p.updatedAt)>150000;
    parts.push(stale && p.status==='online' ? '離席中' : (labels[p.status]||'状態不明'));
  }
  const d=dmActivity.devices;
  if(d?.share===true) parts.push(d.device==='mobile'?'スマホ':d.device==='pc'?'PC':'端末不明');
  const a=dmActivity.activities;
  if(a?.share===true && a.label) parts.push(a.label);
  const l=dmActivity.lastSeen;
  if(l?.share===true && l.at) parts.push('最終 '+fmtList(l.at));
  return parts.join(' ・ ');
}

function renderRooms(){
  const list = $('#roomList'); if (!list) return;
  const isUnread = r => !!(r.id !== cur && r.lastUid && r.lastUid !== me.uid && ms(r.lastMsgTs) > (readMap[r.id] || 0));
  const q = roomSearch.trim().toLocaleLowerCase();
  const arr = Object.values(rooms)
    .filter(r => listFilter==='all' || (listFilter==='dm') === isDm(r))
    .filter(r => !unreadOnly || isUnread(r))
    .filter(r => !q || [roomTitle(r),r.lastMsg,r.desc,r.id].some(v=>String(v||'').toLocaleLowerCase().includes(q)))
    .sort(roomSorter());
  $('#roomCount').textContent = arr.length+'件';

  list.replaceChildren();
  if (!arr.length){ list.append(h('div',{class:'empty'},q?'検索に一致する会話がありません。':unreadOnly?'未読の会話はありません。':'ここにはまだ何もありません。',h('br'),'「新しく探す」から友だちやルームを追加できます。')); return; }

function openRoom(id){
  if (!rooms[id]) return;
  if (cur === id){ document.body.classList.add('in-chat'); return; }
  if (cur && rooms[cur] && isDm(rooms[cur])) publishDmActivity('away',cur);
  unsubMsgs?.(); pendingRead.clear(); replyTo = null;
  cur = id; readMap[id] = Date.now(); saveRead();
  document.body.classList.add('in-chat');
  $('#main').replaceChildren(
    h('div',{class:'chat-head',id:'chatHead'}),
    h('div',{id:'pinBar'}),
    h('div',{id:'memoBar'}),
    h('div',{class:'msgs',id:'msgs'}),
    h('div',{class:'hint',id:'chatEmpty',hidden:true},'まだメッセージはありません。最初の一言を送ってみましょう。'),
    composer());
  renderHeader(); renderRooms();
  document.body.classList.toggle('hide-read', hidingRead()); drawMemoBar(id);
  subscribeMessages(id);
  if (isDm(rooms[id])) { watchDmActivity(rooms[id]); publishDmActivity(document.hidden?'away':'online',id); } else stopDmActivityWatch();
}
function closeRoom(){
  if (cur && rooms[cur] && isDm(rooms[cur])) publishDmActivity('away',cur);
  unsubMsgs?.(); unsubMsgs = null; stopDmActivityWatch(); cur = null; pendingRead.clear(); replyTo = null;
  document.body.classList.remove('in-chat');
  $('#main')?.replaceChildren(welcome());

}

async function banMember(r, u, redraw){

  try {
    await sysMsg(r, nameOf(u) + 'がBANされました').catch(()=>{});

    if ((r.admins||[]).includes(u)) upd.admins = arrayRemove(u);

  } catch(e){ console.error(e); toast('BANできませんでした（Firestoreのルールを確認してください）'); }

async function removeRoom(r){
  const dm = isDm(r);
  if (!(await confirmBox(dm ? 'DMを削除' : 'ルームを削除', dm ? 'このDMの履歴がすべて消えます。相手側からも消えます。' : 'ルームとメッセージがすべて消えます。メンバー全員から見えなくなります。', '削除する'))) return;
  if (cur === r.id) closeRoom();
  try {
    for (const sub of ['messages','images','calls']){
      for (;;){
        const sn = await getDocs(query(collection(db, r.col, r.id, sub), limit(100)));
        if (sn.empty) break;
        const b = writeBatch(db); sn.docs.forEach(d => b.delete(d.ref)); await b.commit();
      }
    }
    await deleteDoc(roomRef(r));
    toast('削除しました');
  } catch(e){ console.error(e); toast('削除できませんでした（ルールの設定を確認してください）'); }
}
async function leaveRoom(r){
  if (!(await confirmBox('ルームから退出', '「'+roomTitle(r)+'」から退出します。ルームIDがあれば、またいつでも入れます。', '退出する'))) return;
  if (cur === r.id) closeRoom();
  try { await sysMsg(r, myName()+'が退出しました').catch(()=>{}); await updateDoc(roomRef(r), {members: arrayRemove(me.uid)}); toast('退出しました'); }
  catch(e){ console.error(e); toast('退出できませんでした'); }

/* ---------- messages (incremental rendering) ---------- */
function subscribeMessages(id){
  const r0 = rooms[id];
  const els = curEls = new Map(); msgCache = new Map();
  let first = true;
  const q = query(msgCol(r0), orderBy('ts','asc'), limitToLast(300));
  unsubMsgs = onSnapshot(q, snap => {
    if (cur !== id) return;
    const box = $('#msgs'); if (!box) return;
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
    let mineAdded = false;
    snap.docChanges().forEach(ch => {
      const mid = ch.doc.id, m = ch.doc.data({serverTimestamps:'estimate'});
      if (ch.type === 'removed'){ els.get(mid)?.remove(); els.delete(mid); msgCache.delete(mid); pendingRead.delete(mid); return; }
      msgCache.set(mid, m);
      if (ch.type === 'modified' && ch.oldIndex === ch.newIndex && els.get(mid)){
        const open = els.get(mid).classList.contains('open');
        const el = msgEl(mid, m); if (open) el.classList.add('open');
        els.get(mid).replaceWith(el); els.set(mid, el);
      } else {
        els.get(mid)?.remove();
        const el = msgEl(mid, m); els.set(mid, el);
        box.insertBefore(el, box.children[ch.newIndex] || null);
        if (ch.type === 'added' && m.author === me.uid) mineAdded = true;
      }
      if (m.type !== 'system' && m.author !== me.uid && !(m.readBy||[]).includes(me.uid)) pendingRead.add(mid);
    });
    const empty = $('#chatEmpty'); if (empty) empty.hidden = box.children.length > 0;
    if (first || nearBottom || mineAdded) box.scrollTop = box.scrollHeight;
    first = false;
    readMap[id] = Date.now(); saveRead();
    flushRead();
  }, e => { console.error('msgs', e); toast('メッセージを読み込めません'); });
}
async function flushRead(){
  const r = rooms[cur];
  if (!inFocus() || !r || !pendingRead.size) return;
  const ids = [...pendingRead]; pendingRead.clear();
  if (hidingRead()) return;
  try {
    const b = writeBatch(db);
    ids.forEach(mid => b.update(doc(db, r.col, r.id, 'messages', mid), {readBy: arrayUnion(me.uid)}));
    await b.commit();
  } catch(e){ /* a message may have vanished */ }
}
function linkify(t){
  const out = []; const re = /(https?:\/\/[^\s<]+)/g; let last = 0, m;
  while ((m = re.exec(t))){
    if (m.index > last) out.push(t.slice(last, m.index));
    out.push(h('a',{href:m[1],target:'_blank',rel:'noopener noreferrer'},m[1]));
    last = m.index + m[0].length;
  }
  if (last < t.length) out.push(t.slice(last));
  return out;
}

    if (rc.children.length) el.append(rc);

const fullCache = new Map();
function openImage(r, mid, m){
  const ov = h('div',{class:'lb'});
  const img = h('img',{src:m.image,alt:'画像',draggable:'false'});
  const note = h('div',{class:'lb-note',hidden:true},'高画質を読み込み中…');
  let sc = 1, tx = 0, ty = 0, moved = false, lastTap = 0, startDist = 0, startSc = 1;
  const pts = new Map();
  const apply = () => { if (sc <= 1){ tx = 0; ty = 0; } img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  const zoomAt = (ns, cx, cy) => {
    ns = Math.min(8, Math.max(1, ns));
    const rc = ov.getBoundingClientRect(), px = cx - rc.left - rc.width / 2, py = cy - rc.top - rc.height / 2;
    tx = px - (px - tx) * (ns / sc); ty = py - (py - ty) * (ns / sc); sc = ns; apply();
  };
  const close = () => { document.removeEventListener('keydown', onKey); ov.remove(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const dl = h('a',{'aria-label':'保存',title:'保存',download:'chatspace-image',href:m.image}, ico('download',20));
  const bar = h('div',{class:'lb-bar'},
    h('button',{'aria-label':'縮小',onclick:e=>{ e.stopPropagation(); zoomAt(sc/1.5, innerWidth/2, innerHeight/2); }},'−'),
    h('button',{'aria-label':'拡大',onclick:e=>{ e.stopPropagation(); zoomAt(sc*1.5, innerWidth/2, innerHeight/2); }},'+'),
    dl,
    h('button',{'aria-label':'閉じる',onclick:close}, ico('x',22)));
  ov.addEventListener('pointerdown', e => {
    if (e.target.closest('.lb-bar')) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = false;
    if (pts.size === 2){ const [p, q] = [...pts.values()]; startDist = Math.hypot(p.x - q.x, p.y - q.y); startSc = sc; }
  });
  ov.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (pts.size === 2){
      pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (startDist) zoomAt(startSc * d / startDist, (a.x + b.x) / 2, (a.y + b.y) / 2);
      moved = true;
    } else {
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      if (sc > 1){ tx += dx; ty += dy; apply(); }
      pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size === 0 && !moved && !e.target.closest('.lb-bar')){
      const now = Date.now();
      if (e.target === img && now - lastTap < 320){ sc > 1 ? (sc = 1, apply()) : zoomAt(2.5, e.clientX, e.clientY); lastTap = 0; }
      else if (e.target === img) lastTap = now;
      else if (e.target === ov) close();
    }
  };
  ov.addEventListener('pointerup', up);
  ov.addEventListener('pointercancel', up);
  ov.addEventListener('wheel', e => { e.preventDefault(); zoomAt(sc * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, {passive:false});
  ov.append(img, bar, note);
  document.body.append(ov);
  if (m.hasFull){
    const key = r.col + '/' + r.id + '/' + mid;
    const show = data => { if (!ov.isConnected) return; img.src = data; dl.href = data; note.hidden = true; };
    if (fullCache.has(key)) show(fullCache.get(key));
    else {
      note.hidden = false;
      getDoc(doc(db, r.col, r.id, 'images', mid)).then(sn => {
        if (sn.exists() && typeof sn.data().data === 'string' && sn.data().data.startsWith('data:image/')){ fullCache.set(key, sn.data().data); show(sn.data().data); }
        else note.hidden = true;
      }).catch(() => { note.textContent = '高画質を読み込めませんでした'; setTimeout(() => note.hidden = true, 2500); });
    }
  }
}
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('load')); i.src = url; });
    const W = img.naturalWidth, H = img.naturalHeight;
    const type = (() => { const c = document.createElement('canvas'); c.width = c.height = 1; return c.toDataURL('image/webp').startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg'; })();
    const draw = (edge, q) => {
      const sc = Math.min(1, edge / Math.max(W, H));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(W * sc)); c.height = Math.max(1, Math.round(H * sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL(type, q);
    };
    let full = null;
    outer: for (const edge of [2560, 2048, 1600, 1280, 1024]){
      for (const q of [0.85, 0.75, 0.65]){ const out = draw(edge, q); if (out.length <= 880000){ full = out; break outer; } }
    }
    if (!full) throw new Error('too big');
    let thumb = null;
    for (const [edge, q] of [[640, 0.72], [480, 0.65], [360, 0.6]]){ thumb = draw(edge, q); if (thumb.length <= 90000) break; }
    return {full, thumb};
  } finally { URL.revokeObjectURL(url); }
}

async function squareThumb(file, size){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('load')); i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
    g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
    return c.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- 画面共有（通話中） ---------- */
const canShare = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
async function getScreen(onEnded){
  if (!canShare){ toast('この端末・ブラウザは、画面共有に対応していません（パソコンのブラウザで使えます）'); return null; }
  try {
    const st = await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:15, max:30}, width:{max:1920}, height:{max:1080}}, audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false, suppressLocalAudioPlayback:true}});
    const t = st.getVideoTracks()[0];
    try { t.contentHint = 'detail'; } catch(e){}
    t.onended = onEnded;
    return st;
  } catch(e){ if (e.name !== 'NotAllowedError') toast('画面共有を始められませんでした'); return null; }
}
async function getCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('この端末・ブラウザは、カメラに対応していません'); return null; }
  try { return await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:20, max:24}, facingMode:'user'}, audio:false}); }
  catch(e){ toast('カメラが使えません。ブラウザのカメラの許可を確認してください'); return null; }
}
async function setSender(sender, track, maxBps){
  if (!sender) throw new Error('no sender');
  await sender.replaceTrack(track);
  if (track){
    try { const p = sender.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}]; p.encodings[0].maxBitrate = maxBps || 1500000; await sender.setParameters(p); } catch(e){}
  }
}
function makeVid(stream){

  v.muted = true; v.srcObject = stream;
  v.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else if (v.requestFullscreen) v.requestFullscreen(); });
  return v;
}
const stopStream = st => { if (st) st.getTracks().forEach(t => { t.onended = null; t.stop(); }); };

/* ---------- 通話（1対1の音声通話） ---------- */
let ICE = {iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun2.l.google.com:19302']}]};
const TURN_URL = '';  // ← CloudflareのWorkerのURLを、ここに貼ります（空のままなら、今までどおり）
let iceTimer;
async function loadIce(){
  if (!TURN_URL) return;
  try {
    const j = await (await fetch(TURN_URL)).json(), ic = [].concat(j.iceServers || []);
    if (ic.length) ICE = {iceServers:[ICE.iceServers[0], ...ic]};
  } catch(e){ console.warn('TURN取得に失敗', e); }
  if (!iceTimer) iceTimer = setInterval(loadIce, 6*3600e3);
}
let call = null, incoming = null, ringCtx = null, ringTimer = null;
const handledCalls = new Set();
const fmtDur = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');

function startRing(){
  stopRing();
  if (isQuiet()){ navigator.vibrate && navigator.vibrate([300,150,300]); ringTimer = setInterval(() => { navigator.vibrate && navigator.vibrate([300,150,300]); }, 1600); return; }
  try {
    ringCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => { if (!ringCtx) return; const o = ringCtx.createOscillator(), g = ringCtx.createGain(); o.frequency.value = 480; g.gain.value = 0.08; o.connect(g); g.connect(ringCtx.destination); o.start(); o.stop(ringCtx.currentTime + 0.35); };
    beep();
    ringTimer = setInterval(() => { beep(); navigator.vibrate && navigator.vibrate([300,150,300]); }, 1600);
  } catch(e){}
}
function stopRing(){ clearInterval(ringTimer); ringTimer = null; try { ringCtx && ringCtx.close(); } catch(e){} ringCtx = null; }

function newCall(o){
  const pc = new RTCPeerConnection(ICE);
  const audio = h('audio',{autoplay:'',playsinline:'',style:'display:none'}); document.body.append(audio);
  const c = {...o, pc, audio, pending:[], unsubs:[], state:'ringing', connectedAt:0, muted:false};
  o.stream.getTracks().forEach(t => pc.addTrack(t, o.stream));
  pc.ontrack = e => {
    if (e.track.kind === 'audio'){
      if (e.streams && e.streams[0]){ audio.srcObject = e.streams[0]; audio.play().catch(()=>{}); }
      else { if (!c.saudio){ c.saudio = h('audio',{autoplay:'',playsinline:'',style:'display:none'}); document.body.append(c.saudio); } c.saudio.srcObject = new MediaStream([e.track]); c.saudio.play().catch(()=>{}); }
    }
    else {
      const vs = pc.getTransceivers().filter(t => t.receiver.track.kind === 'video');
      if (vs.indexOf(e.transceiver) === 1) c.remoteCStream = new MediaStream([e.track]);
      else c.remoteVStream = new MediaStream([e.track]);
      drawCallUI();
    }
  };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if (st === 'connected'){ c.state = 'active'; c.connectedAt = c.connectedAt || Date.now(); clearTimeout(c.ringTimeout); stopRing(); drawCallUI(); }
    else if (st === 'failed'){ toast('通話がつながりませんでした（回線の都合で、つながらないことがあります）'); finishCall(c, 'ended', true); }
    else if (st === 'disconnected'){ clearTimeout(c.dropTimer); c.dropTimer = setTimeout(() => { if (call === c && pc.connectionState !== 'connected') finishCall(c, 'ended', true); }, 8000); }
  };
  call = c;
  return c;
}
function addCand(c, d){ if (c.pc.remoteDescription) c.pc.addIceCandidate(d).catch(()=>{}); else c.pending.push(d); }
function flushCands(c){ c.pending.splice(0).forEach(d => c.pc.addIceCandidate(d).catch(()=>{})); }
const candJson = cand => JSON.parse(JSON.stringify(cand.toJSON()));

async function getMic(){
  if (!window.RTCPeerConnection || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('この端末・ブラウザは、通話に対応していません'); return null; }
  try { return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); }
  catch(e){ toast('マイクが使えません。ブラウザのマイクの許可を確認してください'); return null; }
}

async function startCall(withCam){
  const r = rooms[cur];
  if (!r || !isDm(r)) return;
  if (call || incoming || gcall) return toast('ほかの通話中です');
  const stream = await getMic(); if (!stream) return;
  const camStream = withCam ? await getCam() : null;
  const peer = otherUid(r);
  const callRef = doc(collection(db, r.col, r.id, 'calls'));
  const c = newCall({role:'caller', r, dmId:r.id, callId:callRef.id, stream, peer});
  try {
    c.pc.onicecandidate = e => { if (e.candidate) addDoc(collection(callRef,'callerCandidates'), candJson(e.candidate)).catch(()=>{}); };
    c.vtr = c.pc.addTransceiver('video', {direction:'sendrecv'});
    c.atr = c.pc.addTransceiver('audio', {direction:'sendrecv'});
    c.ctr = c.pc.addTransceiver('video', {direction:'sendrecv'});
    if (camStream){ c.cam = camStream; await setSender(c.ctr.sender, camStream.getVideoTracks()[0], 450000).catch(()=>{}); }
    const offer = await c.pc.createOffer();
    await c.pc.setLocalDescription(offer);
    await setDoc(callRef, {offer:{type:offer.type, sdp:offer.sdp}, caller:me.uid, callee:peer, createdAt:serverTimestamp(), ...(c.cam ? {cam:{[me.uid]:true}} : {})});
    await updateDoc(roomRef(r), {callId:callRef.id, callState:'ringing', callFrom:me.uid, callTs:serverTimestamp()});
  } catch(e){ console.error(e); toast('電話をかけられませんでした（Firestoreのルールを確認してください）'); c.silent = true; finishCall(c, 'ended', false); return; }
  c.unsubs.push(onSnapshot(callRef, sn => {
    const d = sn.data();
    const rs = !!(d && d.sharing && d.sharing !== me.uid);
    if (rs !== !!c.remoteSharing){ c.remoteSharing = rs; drawCallUI(); }
    const rc = !!(d && d.cam && d.cam[c.peer]);
    if (rc !== !!c.remoteCam){ c.remoteCam = rc; drawCallUI(); }
    if (d && d.answer && !c.pc.currentRemoteDescription && !c.gotAnswer){
      c.gotAnswer = true;
      c.pc.setRemoteDescription(d.answer).then(() => flushCands(c)).catch(()=>{});
      if (c.state === 'ringing') { c.state = 'connecting'; drawCallUI(); }
    }
  }));
  c.unsubs.push(onSnapshot(collection(callRef,'calleeCandidates'), sn => sn.docChanges().forEach(ch => { if (ch.type === 'added') addCand(c, ch.doc.data()); })));
  c.ringTimeout = setTimeout(() => { if (call === c && c.state === 'ringing') finishCall(c, 'missed', true); }, 45000);
  drawCallUI();
  startRing();
}

async function answerCall(){
  const i = incoming; if (!i) return;
  hideIncoming();
  if (i.group) return joinGroupCall(i.r, i.callId, false);
  const stream = await getMic();
  if (!stream){ updateDoc(doc(db,i.r.col,i.r.id),{callState:'declined'}).catch(()=>{}); return; }
  const r = i.r;
  const callRef = doc(db, r.col, r.id, 'calls', i.callId);
  let d;
  try { d = (await getDoc(callRef)).data(); } catch(e){}
  if (!d || !d.offer){ stream.getTracks().forEach(t => t.stop()); return toast('通話が終了していました'); }
  const c = newCall({role:'callee', r, dmId:r.id, callId:i.callId, stream, peer:r.callFrom});
  c.state = 'connecting';
  try {
    c.pc.onicecandidate = e => { if (e.candidate) addDoc(collection(callRef,'calleeCandidates'), candJson(e.candidate)).catch(()=>{}); };
    await c.pc.setRemoteDescription(d.offer);
    const vts = c.pc.getTransceivers().filter(t => t.receiver.track.kind === 'video');
    c.vtr = vts[0] || null; c.ctr = vts[1] || null;
    vts.forEach(t => { t.direction = 'sendrecv'; });
    c.atr = c.pc.getTransceivers().filter(t => t.receiver.track.kind === 'audio')[1] || null;
    if (c.atr) c.atr.direction = 'sendrecv';
    const ans = await c.pc.createAnswer();
    await c.pc.setLocalDescription(ans);
    await updateDoc(callRef, {answer:{type:ans.type, sdp:ans.sdp}});
    await updateDoc(roomRef(r), {callState:'active'});
    c.unsubs.push(onSnapshot(callRef, sn => { const dd = sn.data(); const rs = !!(dd && dd.sharing && dd.sharing !== me.uid); if (rs !== !!c.remoteSharing){ c.remoteSharing = rs; drawCallUI(); } const rc = !!(dd && dd.cam && dd.cam[c.peer]); if (rc !== !!c.remoteCam){ c.remoteCam = rc; drawCallUI(); } }));
    c.unsubs.push(onSnapshot(collection(callRef,'callerCandidates'), sn => sn.docChanges().forEach(ch => { if (ch.type === 'added') addCand(c, ch.doc.data()); })));
    flushCands(c);
    drawCallUI();
  } catch(e){ console.error(e); toast('通話を始められませんでした'); finishCall(c, 'ended', true); }
}

function declineCall(){
  const i = incoming; hideIncoming();
  if (i && !i.group) updateDoc(doc(db, i.r.col, i.r.id), {callState:'declined'}).catch(()=>{});
}

async function finishCall(c, state, writeRemote){
  if (!c || c.done) return;
  c.done = true;
  clearTimeout(c.ringTimeout); clearTimeout(c.dropTimer); clearInterval(c.tick); stopRing();
  c.unsubs.forEach(f => f());
  try { c.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  stopStream(c.screen); c.screen = null; stopStream(c.cam); c.cam = null;
  try { c.pc.close(); } catch(e){}
  c.audio.remove(); if (c.saudio) c.saudio.remove();
  if (call === c) call = null;
  const ui = $('#callUI'); if (ui) ui.remove();
  const dur = c.connectedAt ? Math.round((Date.now() - c.connectedAt) / 1000) : 0;
  if (writeRemote) updateDoc(roomRef(c.r), {callState: state}).catch(()=>{});

    sysMsg(c.r, text).catch(()=>{});
  }
}

      h('button',{class:'cbtn'+(c.screen?' on':''),'aria-label':c.screen?'画面共有をやめる':'画面を共有する',onclick:()=>toggleShareDm(c)}, ico('screen', 28)),

function hideIncoming(){

function callWatch(){
  for (const r of Object.values(rooms)){
    if (!isDm(r)){
      if (incoming && incoming.group && incoming.dmId === r.id && r.callState !== 'active') hideIncoming();
      if (r.callState === 'active' && r.callId && r.callFrom && r.callFrom !== me.uid && !gcall && !call && !incoming && !handledCalls.has(r.callId) && Date.now() - ms(r.callTs) < 50000) showIncoming(r, true);
      continue;
    }
    if (call && call.dmId === r.id && r.callId === call.callId && ['ended','declined','missed'].includes(r.callState)) finishCall(call, r.callState, false);
    if (incoming && incoming.dmId === r.id && r.callId === incoming.callId && r.callState !== 'ringing') hideIncoming();
    if (r.callState === 'ringing' && r.callFrom && r.callFrom !== me.uid && !call && !incoming && !handledCalls.has(r.callId) && Date.now() - ms(r.callTs) < 50000) showIncoming(r);
  }
}

/* ---------- グループ通話（メッシュ方式・最大6人） ---------- */
let gcall = null;
const GMAX = 6;

async function groupCallAction(withCam){
  const r = rooms[cur]; if (!r) return;
  if (gcall) return toast('すでに通話中です');
  if (call || incoming) return toast('ほかの通話中です');
  const active = r.callState === 'active' && r.callId && Date.now() - ms(r.callTs) < 6 * 3600 * 1000;
  if (active) return joinGroupCall(r, r.callId, false, !!withCam);
  return joinGroupCall(r, doc(collection(db, r.col, r.id, 'calls')).id, true, !!withCam);
}
const peerRec = (g, uid) => { let p = g.peers.get(uid); if (!p){ p = {pc:null, audio:null, pending:[], state:'connecting'}; g.peers.set(uid, p); } return p; };
const sendSig = (g, to, type, data) => addDoc(collection(g.callRef, 'signals'), {from:me.uid, to, type, data, ts:serverTimestamp()}).catch(()=>{});
function closePeer(g, uid){
  const p = g.peers.get(uid);
  if (p){ try { p.pc && p.pc.close(); } catch(e){} p.audio && p.audio.remove(); p.saudio && p.saudio.remove(); g.peers.delete(uid); }
}
function makePc(g, uid){
  const p = peerRec(g, uid);
  if (p.pc) return p;
  const pc = new RTCPeerConnection(ICE); p.pc = pc;
  p.audio = h('audio',{autoplay:'',playsinline:'',style:'display:none'}); document.body.append(p.audio);
  g.stream.getTracks().forEach(t => pc.addTrack(t, g.stream));
  pc.ontrack = e => {
    if (e.track.kind === 'audio'){
      if (e.streams && e.streams[0]){ p.audio.srcObject = e.streams[0]; p.audio.play().catch(()=>{}); }
      else { if (!p.saudio){ p.saudio = h('audio',{autoplay:'',playsinline:'',style:'display:none'}); document.body.append(p.saudio); } p.saudio.srcObject = new MediaStream([e.track]); p.saudio.play().catch(()=>{}); }
    }
    else {
      const vs = pc.getTransceivers().filter(t => t.receiver.track.kind === 'video');
      if (vs.indexOf(e.transceiver) === 1) p.cstream = new MediaStream([e.track]);
      else p.vstream = new MediaStream([e.track]);
      drawGroupUI();
    }
  };
  pc.onicecandidate = e => { if (e.candidate) sendSig(g, uid, 'candidate', candJson(e.candidate)); };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    p.state = st === 'connected' ? 'active' : st === 'failed' ? 'failed' : 'connecting';
    if (st === 'failed') toast(nameOf(uid) + 'さんとつながりませんでした');
    drawGroupUI();
  };
  return p;
}
async function offerTo(g, uid){
  const p = makePc(g, uid);
  p.vtr = p.pc.addTransceiver('video', {direction:'sendrecv'});
  p.atr = p.pc.addTransceiver('audio', {direction:'sendrecv'});
  p.ctr = p.pc.addTransceiver('video', {direction:'sendrecv'});
  const off = await p.pc.createOffer();
  await p.pc.setLocalDescription(off);
  sendSig(g, uid, 'offer', {type:off.type, sdp:off.sdp});
}
async function handleSignal(g, sg){
  const uid = sg.from; if (!uid || uid === me.uid) return;
  try {
    if (sg.type === 'offer'){
      const old = g.peers.get(uid);
      if (old && old.pc && old.pc.remoteDescription){ const keep = old.pending; closePeer(g, uid); peerRec(g, uid).pending = keep; }
      const p = makePc(g, uid);
      await p.pc.setRemoteDescription(sg.data);
      const vts = p.pc.getTransceivers().filter(t => t.receiver.track.kind === 'video');
      p.vtr = vts[0] || null; p.ctr = vts[1] || null;
      vts.forEach(t => { t.direction = 'sendrecv'; });
      p.atr = p.pc.getTransceivers().filter(t => t.receiver.track.kind === 'audio')[1] || null;
      if (p.atr) p.atr.direction = 'sendrecv';
      const ans = await p.pc.createAnswer();
      await p.pc.setLocalDescription(ans);
      sendSig(g, uid, 'answer', {type:ans.type, sdp:ans.sdp});
      attachScreen(g, p); attachCam(g, p);
      p.pending.splice(0).forEach(c => p.pc.addIceCandidate(c).catch(()=>{}));
    } else if (sg.type === 'answer'){
      const p = g.peers.get(uid);
      if (p && p.pc && !p.pc.currentRemoteDescription){
        await p.pc.setRemoteDescription(sg.data);
        p.pending.splice(0).forEach(c => p.pc.addIceCandidate(c).catch(()=>{}));
        attachScreen(g, p); attachCam(g, p);
      }
    } else if (sg.type === 'candidate'){
      const p = peerRec(g, uid);
      if (p.pc && p.pc.remoteDescription) p.pc.addIceCandidate(sg.data).catch(()=>{}); else p.pending.push(sg.data);
    }
  } catch(e){ console.warn('signal', e); }
}

async function joinGroupCall(r, callId, isStart, withCam){
  if (gcall) return;
  const stream = await getMic(); if (!stream) return;
  const camStream = withCam ? await getCam() : null;
  const callRef = doc(db, r.col, r.id, 'calls', callId);
  let live = [];
  try {
    const pd = await getDocs(collection(callRef, 'peers'));
    live = pd.docs.filter(d => d.id !== me.uid && Date.now() - ms(d.data({serverTimestamps:'estimate'}).ts) < 90000);
  } catch(e){ stream.getTracks().forEach(t => t.stop()); console.error(e); return toast('通話に参加できませんでした（Firestoreのルールを確認してください）'); }
  if (live.length >= GMAX - 1){ stream.getTracks().forEach(t => t.stop()); return toast('グループ通話は、' + GMAX + '人までです'); }
  const g = gcall = {r, callId, callRef, stream, peers:new Map(), present:new Set(), names:{}, ptime:{}, sharing:{}, vids:{}, cams:{}, cvids:{}, cam:camStream, unsubs:[], muted:false, startedAt:Date.now()};
  try {
    const old = await getDocs(query(collection(callRef, 'signals'), where('to', '==', me.uid)));
    await Promise.all(old.docs.map(d => deleteDoc(d.ref).catch(()=>{})));
    await setDoc(doc(callRef, 'peers', me.uid), {uid:me.uid, name:myName(), ts:serverTimestamp(), cam:!!camStream});
    if (isStart || !(r.callState === 'active' && r.callId === callId)){
      await setDoc(callRef, {startedBy:me.uid, createdAt:serverTimestamp()}, {merge:true});
      await updateDoc(roomRef(r), {callId, callState:'active', callFrom:me.uid, callTs:serverTimestamp()});
      handledCalls.add(callId);
      sysMsg(r, myName() + 'がグループ通話を始めました').catch(()=>{});
    }
  } catch(e){
    console.error(e); toast('通話に参加できませんでした（Firestoreのルールを確認してください）');
    stream.getTracks().forEach(t => t.stop()); gcall = null; return;
  }
  g.unsubs.push(onSnapshot(collection(callRef, 'peers'), sn => {
    sn.docChanges().forEach(ch => {
      const uid = ch.doc.id; if (uid === me.uid) return;
      const d = ch.doc.data({serverTimestamps:'estimate'});
      if (ch.type === 'removed'){ g.present.delete(uid); closePeer(g, uid); delete g.sharing[uid]; delete g.vids[uid]; delete g.cams[uid]; delete g.cvids[uid]; return; }
      g.ptime[uid] = ms(d.ts) || Date.now();
      g.sharing[uid] = !!d.sharing;
      g.cams[uid] = !!d.cam;
      if (Date.now() - g.ptime[uid] > 90000) return;
      g.names[uid] = d.name;
      if (!g.present.has(uid)){
        g.present.add(uid);
        if (me.uid > uid) offerTo(g, uid).catch(e => console.warn('offer', e)); // 双方が同時に発信しないよう、IDの大きいほうが発信する
      }
    });
    drawGroupUI();
  }));
  g.unsubs.push(onSnapshot(query(collection(callRef, 'signals'), where('to', '==', me.uid)), sn => {
    sn.docChanges().forEach(ch => { if (ch.type === 'added'){ handleSignal(g, ch.doc.data()); deleteDoc(ch.doc.ref).catch(()=>{}); } });
  }));
  g.beat = setInterval(() => {
    updateDoc(doc(callRef, 'peers', me.uid), {ts:serverTimestamp()}).catch(()=>{});
    for (const uid of [...g.present]) if (Date.now() - (g.ptime[uid] || 0) > 90000){ g.present.delete(uid); closePeer(g, uid); }
    drawGroupUI();
  }, 20000);
  g.clock = setInterval(() => { const s = $('#gStat'); if (s) s.textContent = gStatus(g) + (g.screen ? '・画面を共有中' : ''); }, 1000);
  drawGroupUI();
}

function attachCam(g, p){
  if (!g.cam || !p.ctr) return;
  setSender(p.ctr.sender, g.cam.getVideoTracks()[0], 400000).catch(()=>{});
}
async function toggleCamGroup(g){
  if (g.cam){
    stopStream(g.cam); g.cam = null; g.myvid = null;
    await Promise.all([...g.peers.values()].filter(p => p.ctr).map(p => p.ctr.sender.replaceTrack(null).catch(()=>{})));
    updateDoc(doc(g.callRef, 'peers', me.uid), {cam:false}).catch(()=>{});
    return drawGroupUI();
  }
  const st = await getCam(); if (!st) return;
  g.cam = st; g.myvid = null;
  [...g.peers.values()].forEach(p => attachCam(g, p));
  updateDoc(doc(g.callRef, 'peers', me.uid), {cam:true}).catch(()=>{});
  drawGroupUI();
}
function attachScreen(g, p){
  if (!g.screen) return;
  const v = g.screen.getVideoTracks()[0], a = g.screen.getAudioTracks()[0];
  if (p.vtr && v) setSender(p.vtr.sender, v).catch(()=>{});
  if (p.atr && a) p.atr.sender.replaceTrack(a).catch(()=>{});
}
async function toggleShareGroup(g){
  if (g.screen) return stopShareGroup(g);
  const st = await getScreen(() => stopShareGroup(g)); if (!st) return;
  g.screen = st;
  const tr = st.getVideoTracks()[0];
  const at = st.getAudioTracks()[0];
  await Promise.all([...g.peers.values()].filter(p => p.vtr).map(p => Promise.all([setSender(p.vtr.sender, tr).catch(()=>{}), (at && p.atr) ? p.atr.sender.replaceTrack(at).catch(()=>{}) : null])));
  if (!at) toast('画面だけ共有しました。音も届けるには、共有の選択画面で「システム音声」または「タブの音声」にチェックを入れてください');
  updateDoc(doc(g.callRef, 'peers', me.uid), {sharing:true}).catch(()=>{});
  drawGroupUI();
}
async function stopShareGroup(g){
  if (!g.screen) return;
  stopStream(g.screen); g.screen = null;
  await Promise.all([...g.peers.values()].filter(p => p.vtr).map(p => Promise.all([p.vtr.sender.replaceTrack(null).catch(()=>{}), p.atr ? p.atr.sender.replaceTrack(null).catch(()=>{}) : null])));
  updateDoc(doc(g.callRef, 'peers', me.uid), {sharing:false}).catch(()=>{});
  drawGroupUI();
}
const gStatus = g => '通話中 ' + fmtDur(Math.floor((Date.now() - g.startedAt) / 1000)) + '・' + (g.present.size + 1) + '人';
function drawGroupUI(){
  const g = gcall; if (!g) return;
  let ui = $('#gcallUI');
  if (!ui){ ui = h('div',{class:'callov',id:'gcallUI',role:'dialog','aria-label':'グループ通話'}); document.body.append(ui); }
  const who = (uid, label, st, vid) => h('div',{class:'gp'+(vid?' cam':'')}, vid || avatar(uid, label, false, false), h('div',{}, label), h('small',{}, st));
  const peerCam = uid => {
    const p = g.peers.get(uid);
    if (!(g.cams[uid] && p && p.cstream)) return null;
    if (!g.cvids[uid] || g.cvids[uid].srcObject !== p.cstream) g.cvids[uid] = camVid(p.cstream, 'gpv', false);
    return g.cvids[uid];
  };
  if (g.cam && !g.myvid) g.myvid = camVid(g.cam, 'gpv', true);
  const list = [who(me.uid, myName(), '自分' + (g.muted ? '（ミュート中）' : ''), g.cam ? g.myvid : null)];
  g.present.forEach(uid => {
    const p = g.peers.get(uid);
    list.push(who(uid, g.names[uid] || nameOf(uid), !p || !p.pc ? '待っています…' : p.state === 'active' ? '通話中' : p.state === 'failed' ? '接続できません' : '接続中…', peerCam(uid)));
  });
  const sharer = [...g.present].find(u => g.sharing[u] && g.peers.get(u) && g.peers.get(u).vstream);
  let gv = null;
  if (sharer){
    const p = g.peers.get(sharer);
    if (!g.vids[sharer] || g.vids[sharer].srcObject !== p.vstream) g.vids[sharer] = makeVid(p.vstream);
    gv = h('div',{class:'gvid'}, g.vids[sharer], h('div',{class:'cstat'}, (g.names[sharer] || nameOf(sharer)) + 'さんの画面'));
  }
  ui.replaceChildren(
    h('div',{class:'cname'}, roomTitle(g.r)),
    h('div',{class:'cstat',id:'gStat'}, gStatus(g) + (g.screen ? '・画面を共有中' : '')),
    gv,
    h('div',{class:'gl'}, list),
    h('div',{class:'cbtns'},
      h('button',{class:'cbtn'+(g.muted?' on':''),'aria-label':g.muted?'ミュートを解除':'ミュート',onclick:()=>{ g.muted = !g.muted; g.stream.getAudioTracks().forEach(t => t.enabled = !g.muted); drawGroupUI(); }}, ico(g.muted ? 'micoff' : 'mic', 28)),
      h('button',{class:'cbtn'+(g.cam?' on':''),'aria-label':g.cam?'カメラをオフにする':'カメラをオンにする',onclick:()=>toggleCamGroup(g)}, ico(g.cam ? 'video' : 'videooff', 28)),
      h('button',{class:'cbtn'+(g.screen?' on':''),'aria-label':g.screen?'画面共有をやめる':'画面を共有する',onclick:()=>toggleShareGroup(g)}, ico('screen', 28)),
      h('button',{class:'cbtn red','aria-label':'通話から抜ける',onclick:leaveGroupCall}, ico('phone', 28))));
  if (gv){ const vv = gv.querySelector('video'); if (vv) vv.play().catch(()=>{}); }
  document.querySelectorAll('#gcallUI .gl video').forEach(v => v.play().catch(()=>{}));
}
async function leaveGroupCall(){
  const g = gcall; if (!g || g.left) return;
  g.left = true; gcall = null;
  clearInterval(g.beat); clearInterval(g.clock);
  g.unsubs.forEach(f => f());
  [...g.peers.keys()].forEach(uid => closePeer(g, uid));
  g.stream.getTracks().forEach(t => t.stop());
  stopStream(g.screen); g.screen = null; stopStream(g.cam); g.cam = null;
  const ui = $('#gcallUI'); if (ui) ui.remove();
  renderHeader();
  try { await deleteDoc(doc(g.callRef, 'peers', me.uid)); } catch(e){}
  try {
    const left = await getDocs(collection(g.callRef, 'peers'));
    const others = left.docs.filter(d => Date.now() - ms(d.data({serverTimestamps:'estimate'}).ts) < 90000);
    if (!others.length){
      await updateDoc(roomRef(g.r), {callState:'ended'});
      const start = ms(rooms[g.r.id] && rooms[g.r.id].callTs) || g.startedAt;
      sysMsg(g.r, 'グループ通話が終了しました（' + fmtDur(Math.max(0, Math.round((Date.now() - start) / 1000))) + '）').catch(()=>{});
    }
  } catch(e){}
}

/* ---------- notifications ---------- */
async function notify(r){
  const mentioned = (r.lastMentions || []).includes(me.uid);
  const body = (mentioned ? 'あなた宛: ' : '') + (r.lastMsg || '新しいメッセージ');
  if (inFocus()){ toast(roomTitle(r) + ': ' + body.slice(0,30)); return; }
  if (document.hidden && pushDone) return; // 画面が隠れているときは、プッシュ通知が届く（二重に出さない）
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = {body, icon:'icon-192.png?v=2', badge:'icon-192.png?v=2', tag:r.id, renotify:true, silent:isQuiet(), data:{url:'/chat-app/?room='+r.id}};
  try {
    const reg = await navigator.serviceWorker?.ready;
    if (reg) await reg.showNotification(roomTitle(r), opts);
    else new Notification(roomTitle(r), opts);
  } catch(e){}
}
const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function drawBanner(){
  const b = $('#notifyBanner'); if (!b) return;
  b.replaceChildren();
  if (!('Notification' in window)){
    if (isIos && !isStandalone && !localStorage.getItem('cs_nb_ios')) b.append(h('div',{class:'nbanner'}, h('span',{},'通知を使うには、共有ボタンから「ホーム画面に追加」して、そのアプリから開いてください。'), h('button',{class:'icon-btn',style:'width:30px;height:30px','aria-label':'閉じる',onclick:()=>{ localStorage.setItem('cs_nb_ios','1'); drawBanner(); }}, ico('x',16))));
    return;
  }
  if (Notification.permission !== 'default') return;
  b.append(h('div',{class:'nbanner'}, ico('bell',18), h('span',{},'新着メッセージの通知を受け取れます'),
    h('button',{class:'btn',onclick:()=>setupPush(true)},'オンにする')));
}
function autoNotify(){
  drawBanner();
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted'){ setupPush(false); return; }
  if (Notification.permission !== 'default') return;
  // ブラウザの決まりで、許可の確認は画面をタップしたときにしか出せません。最初のタップで自動的に確認を出します。
  if (isIos && !isStandalone) return;
  const once = () => { document.removeEventListener('pointerdown', once, true); if (Notification.permission === 'default') setupPush(true); };
  document.addEventListener('pointerdown', once, true);
}
async function notifyDiag(){
  const box = h('div',{style:'display:grid;gap:6px'});
  const row = (k, v, ok) => box.append(h('div',{class:'urow',style:'align-items:flex-start'},
    h('div',{class:'n'}, k, h('small',{style:'white-space:pre-wrap;word-break:break-all'}, v)),
    h('span',{style:'font-weight:700;color:'+(ok===true?'var(--accent)':ok===false?'var(--danger)':'var(--sub)')}, ok===true?'OK':ok===false?'要確認':'')));
  const btns = h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:6px'});
  modal('通知の状態', [box, btns]);
  const perm = 'Notification' in window ? Notification.permission : '非対応';
  row('許可', perm === 'granted' ? '許可されています' : perm, perm === 'granted');
  let reg = null;
  try { reg = await navigator.serviceWorker.getRegistration(); } catch(e){}
  row('Service Worker', reg ? ('登録済み：' + reg.scope) : '登録されていません', !!reg);
  let token = null, messaging = null, mod = null;
  try {
    mod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js');
    messaging = mod.getMessaging(fb);
    reg = await navigator.serviceWorker.ready;
    token = await mod.getToken(messaging, {vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    row('この端末の通知トークン', token ? ('取得できました（末尾 …' + token.slice(-8) + '）') : '取得できませんでした', !!token);
  } catch(e){ row('この端末の通知トークン', '取得に失敗：' + (e.code || '') + ' ' + (e.message || e), false); }
  try {
    const snap = await getDoc(doc(db,'users',me.uid));
    const list = (snap.data() || {}).fcmTokens || [];
    const has = token && list.includes(token);
    if (token && !has){ await updateDoc(doc(db,'users',me.uid), {fcmTokens: arrayUnion(token)}); row('サーバーへの登録', 'この端末が未登録だったので、今、登録しました。もう一度テストしてみてください', true); }
    else row('サーバーへの登録', has ? '登録されています（登録済みの端末：' + list.length + '台）' : '登録されていません', !!has);
  } catch(e){ row('サーバーへの登録', '確認に失敗：' + (e.message || e), false); }
  btns.append(
    h('button',{class:'btn',onclick:async()=>{
      try { const r = await navigator.serviceWorker.ready; await r.showNotification('ChatSpace', {body:'この端末の通知テストです。これが見えれば、表示はできています', icon:'icon-192.png?v=2', tag:'diag'}); toast('通知を出しました。見えますか？'); }
      catch(e){ toast('通知を出せませんでした：' + (e.message || e)); }
    }}, 'この端末に通知を出してみる'),
    h('button',{class:'btn ghost',onclick:async()=>{
      try {
        if (!mod) return toast('先に上の項目を確認してください');
        try { await mod.deleteToken(messaging); } catch(_){}
        const nt = await mod.getToken(messaging, {vapidKey:VAPID_KEY, serviceWorkerRegistration:await navigator.serviceWorker.ready});
        const ups = {fcmTokens: arrayUnion(nt)};
        await updateDoc(doc(db,'users',me.uid), ups);
        if (token && token !== nt) await updateDoc(doc(db,'users',me.uid), {fcmTokens: arrayRemove(token)});
        token = nt; toast('通知を登録し直しました');
      } catch(e){ toast('登録し直せませんでした：' + (e.message || e)); }
    }}, '通知を登録し直す'));
}
let pushDone = false;
async function testPush(){
  if (!PUSH_URL) return toast('通知の中継URL（PUSH_URL）がまだ設定されていません');
  await setupPush(true);
  if (!pushDone) return;
  try {
    const idToken = await me.getIdToken();
    const r = await fetch(PUSH_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({idToken, test:true})});
    const j = await r.json();
    if (j.error) return toast('中継でエラー: ' + j.error);
    if (!j.tokens) return toast('この端末が登録されていません。通知をオンにし直してください');
    if (!j.sent) return toast('送信に失敗しました: ' + ((j.errors && j.errors[0]) || '').slice(0, 80));
    toast('テスト通知を送りました。数秒待ってください（画面を別のタブにすると見えやすいです）');
  } catch(e){ toast('中継に接続できません。URLを確認してください'); }
}
async function setupPush(interactive){
  if (!('Notification' in window) || !('serviceWorker' in navigator)){ if (interactive) toast('このブラウザは通知に対応していません（iPhoneはホーム画面に追加すると使えます）'); return; }
  let perm = Notification.permission;
  if (perm === 'default' && interactive) perm = await Notification.requestPermission();
  drawBanner();
  if (perm !== 'granted'){ if (interactive && perm === 'denied') toast('通知がブロックされています。ブラウザの設定から許可してください'); return; }
  if (pushDone){ if (interactive) toast('通知はオンです'); return; }
  try {
    const { getMessaging, getToken } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js');
    const reg = await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(fb), {vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    if (token) await updateDoc(doc(db,'users',me.uid), {fcmTokens: arrayUnion(token)});
    pushDone = true;
    if (interactive) toast('通知をオンにしました');
  } catch(e){ console.warn('push', e); if (interactive) toast('通知の設定に失敗しました'); }
}
