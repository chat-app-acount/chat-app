<!doctype html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7a6d">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChatSpace">
<title>ChatSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0ee;--panel:#f8faf9;--ink:#16221f;--sub:#6b7d78;--line:#d5dfdb;
  --accent:#0e7a6d;--accent-ink:#fff;--mine:#0e7a6d;--mine-ink:#fff;--other:#fff;--hover:#e0e9e6;--danger:#c2410c;
}
@media(prefers-color-scheme:dark){
  :root[data-theme="auto"]{--bg:#0c1211;--panel:#121b19;--ink:#e3efec;--sub:#8aa19b;--line:#223330;--accent:#34b8a6;--accent-ink:#06211d;--mine:#17705f;--mine-ink:#fff;--other:#1a2624;--hover:#182421;--danger:#fb923c}
}
:root[data-theme="dark"]{--bg:#0c1211;--panel:#121b19;--ink:#e3efec;--sub:#8aa19b;--line:#223330;--accent:#34b8a6;--accent-ink:#06211d;--mine:#17705f;--mine-ink:#fff;--other:#1a2624;--hover:#182421;--danger:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.field{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none}
.field:focus{border-color:var(--accent)}

/* login */
.login{height:100dvh;display:grid;place-items:center;padding:20px;overflow:auto}
.login-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px 26px;display:grid;gap:14px}
.wordmark{font-size:30px;font-weight:700;letter-spacing:.02em}
.wordmark i{font-style:normal;color:var(--accent)}
.login-card p.lead{color:var(--sub);margin-top:-6px}
.login-card .err{color:var(--danger);font-size:13px;min-height:18px}
.sep{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.linklike{color:var(--accent);font-weight:700;text-align:center}
.setup{max-width:640px;margin:8vh auto;padding:0 20px;overflow:auto;height:84dvh}
.setup code,.setup pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:13px}
.setup pre{display:block;padding:12px;overflow:auto;margin:8px 0 16px}

/* shell */
.shell{display:grid;grid-template-columns:330px 1fr;height:100dvh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;gap:6px;padding:14px 12px 10px 18px}
.side-head .wordmark{font-size:22px;flex:1}
.side-actions{display:flex;gap:8px;padding:0 14px 12px}
.side-actions .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;font-size:14px}
.room-list{flex:1;overflow-y:auto;padding:4px 8px 12px}
.room{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;width:100%;text-align:left}
.room:hover{background:var(--hover)}
.room.active{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.room .meta{flex:1;min-width:0}
.room .top{display:flex;gap:8px;align-items:baseline}
.room .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.room .time{font-size:12px;color:var(--sub);flex:none}
.room .last{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room.unread .last{color:var(--ink);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none;position:relative}
.avatar.sm{width:34px;height:34px;font-size:14px}
.avatar .on{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid var(--panel)}
.empty{color:var(--sub);text-align:center;padding:40px 20px;font-size:14px}

.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.chat-head .back{display:none}
.chat-head .titles{flex:1;min-width:0}
.chat-head .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.chat-head .s.typing{color:var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.hint{position:absolute;inset:60px 0 70px 0;display:grid;place-items:center;color:var(--sub);pointer-events:none;text-align:center;padding:20px}
.welcome{flex:1;display:grid;place-items:center;color:var(--sub);text-align:center;padding:20px}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:min(78%,560px)}
.msg.mine{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;color:var(--sub);margin:0 6px 2px}
.bubble{background:var(--other);padding:8px 13px;border-radius:18px 18px 18px 6px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;cursor:pointer;border:1px solid var(--line)}
.msg.mine .bubble{background:var(--mine);color:var(--mine-ink);border-color:transparent;border-radius:18px 18px 6px 18px}
.bubble a{color:inherit;text-decoration:underline}
.bubble.stamp{background:none;border:0;font-size:56px;line-height:1.15;padding:0 2px}
.info{font-size:11px;color:var(--sub);margin:2px 6px 0;display:flex;gap:8px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 8px;font-size:13px;line-height:24px}
.chip.on{border-color:var(--accent);background:var(--hover)}
.bar{display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin-top:4px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.msg.open .bar{display:flex}
.bar button{width:32px;height:32px;border-radius:50%;font-size:17px;display:grid;place-items:center}
.bar button:hover{background:var(--hover)}
.bar .del{color:var(--danger)}

.composer{position:relative;display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;max-height:140px;min-height:42px;padding:10px 14px;border-radius:21px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:16px;line-height:1.45}
.composer textarea:focus{border-color:var(--accent)}
.send{background:var(--accent);color:var(--accent-ink)}
.send:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
.send:disabled{opacity:.45}
.stamps{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;flex-direction:column;max-width:420px;max-height:min(340px,50dvh)}
.stamps.show{display:flex}
.stab{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.stab button{padding:4px 12px;border-radius:999px;font-size:13px;white-space:nowrap;color:var(--sub)}
.stab button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:2px;padding:8px;overflow-y:auto}
.sgrid button{font-size:30px;line-height:1;padding:8px 0;border-radius:12px}
.sgrid button:hover{background:var(--hover)}

/* modal / popup / toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(420px,100%);max-height:86dvh;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;padding:14px 12px 6px 20px;font-weight:700;font-size:17px}
.modal-h span:first-child{flex:1}
.modal-b{padding:8px 20px 20px;display:grid;gap:12px;overflow-y:auto}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.tabs button{flex:1;padding:7px;border-radius:999px;font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.urow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;width:100%;text-align:left}
.urow:hover{background:var(--hover)}
.urow .n{flex:1;min-width:0}
.urow .n small{display:block;color:var(--sub);font-size:12px}
.popup{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;min-width:220px}
.popup button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;text-align:left}
.popup button:hover{background:var(--hover)}
.popup .danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:70;font-size:14px;max-width:90vw}
.codebox{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;letter-spacing:.15em;justify-content:space-between}

@media(max-width:760px){
  .shell{display:block;position:relative}
  .side,.main{position:absolute;inset:0;width:100%}
  .main{transform:translateX(100%);transition:transform .22s ease;z-index:5}
  body.in-chat .main{transform:none}
  .chat-head .back{display:inline-flex}
  .msg{max-width:86%}
}
@media(prefers-reduced-motion:reduce){.main{transition:none}}

.composer{flex-direction:column;align-items:stretch;gap:6px}
.crow{display:flex;align-items:flex-end;gap:8px}
.replybar{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 10px;border-left:3px solid var(--accent);background:var(--bg);border-radius:8px;font-size:13px;color:var(--sub)}
.replybar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sys{align-self:center;font-size:12px;color:var(--sub);background:var(--hover);padding:2px 12px;border-radius:999px;margin:6px 0;text-align:center}
.quote{font-size:12px;border-left:3px solid var(--accent);padding:1px 8px;margin:0 4px 3px;color:var(--sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble.deleted{font-style:italic;color:var(--sub);background:transparent;border-style:dashed;cursor:default}
.msg.mine .bubble.deleted{color:var(--sub)}
.pinbar{display:flex;gap:8px;align-items:center;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--sub);cursor:pointer}
.pinbar span:last-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.flash .bubble{animation:flash 1.6s}
@keyframes flash{0%,50%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.bar{flex-wrap:wrap;max-width:280px;border-radius:18px}
.msg.mine .bar{justify-content:flex-end}
.bar .sp{width:1px;background:var(--line);margin:4px 3px}
.filters{display:flex;gap:4px;padding:0 14px 8px}
.filters button{padding:3px 12px;border-radius:999px;font-size:13px;color:var(--sub)}
.filters button.on{background:var(--hover);color:var(--ink);font-weight:700}
.ver{font-size:11px;color:var(--sub);text-align:center;padding:6px 0 10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.hit{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px}
.hit:hover{background:var(--hover)}
.hit small{display:block;color:var(--sub);font-size:12px}
.hit div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
.side-head .logo{margin-right:2px}
.side-head .wordmark{flex:1}
.login-card .logo{margin-bottom:-4px}
.nbanner{display:flex;gap:10px;align-items:center;margin:0 12px 8px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--hover);font-size:13px}
.nbanner span{flex:1;min-width:0}
.nbanner .btn{padding:6px 12px;font-size:13px;white-space:nowrap}
.bubble.imgb{padding:3px;background:var(--other);border:1px solid var(--line)}
.msg.mine .bubble.imgb{background:var(--mine)}
.pic{display:block;max-width:min(260px,100%);max-height:320px;border-radius:15px;object-fit:cover}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:80;padding:12px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>

function popup(anchor, items){
  document.querySelectorAll('.popup').forEach(x=>x.remove());
  const r = anchor.getBoundingClientRect();
  const p = h('div',{class:'popup'}, items.map(it => h('button',{class:it.danger?'danger':'',onclick:()=>{p.remove(); it.run();}}, ico(it.icon,18), it.label)));
  document.body.append(p);
  const w = p.offsetWidth;
  p.style.top = (r.bottom + 6) + 'px';
  p.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w)) + 'px';
  setTimeout(()=>document.addEventListener('click', function f(){ p.remove(); document.removeEventListener('click', f); }), 0);
}

onAuthStateChanged(auth, async u => {

async function ensureProfile(u){
  const ref = doc(db,'users',u.uid);
  try {
    const snap = await getDoc(ref);
    if (!snap.exists()){
      await setDoc(ref, {uid:u.uid, name:pendingName || u.displayName || (u.email||'').split('@')[0] || 'ゲスト', email:u.email||'', photoURL:u.photoURL||null, color:COLORS[Math.floor(Math.random()*COLORS.length)], online:true, lastSeen:serverTimestamp(), createdAt:serverTimestamp()});
    } else await updateDoc(ref, {online:true, lastSeen:serverTimestamp()});

/* ---------- listeners ---------- */
function listenUsers(){
  unsubUsers = onSnapshot(collection(db,'users'), snap => {
    users = {}; snap.forEach(d => users[d.id] = d.data());
    renderRooms(); renderHeader();
  }, e => console.error('users', e));
}
function listenRooms(){
  const bucket = {rooms:{}, dms:{}}, loaded = {rooms:false, dms:false};
  const watch = col => onSnapshot(query(collection(db,col), where('members','array-contains', me.uid)), snap => {
    const next = {};
    snap.forEach(d => next[d.id] = {id:d.id, col, ...d.data({serverTimestamps:'estimate'})});
    if (loaded[col]) for (const r of Object.values(next)){
      const p = bucket[col][r.id];
      if (p && ms(r.lastMsgTs) > ms(p.lastMsgTs) && r.lastUid && r.lastUid !== me.uid && (document.hidden || r.id !== cur)) notify(r);
    }
    bucket[col] = next; loaded[col] = true;
    rooms = {...bucket.rooms, ...bucket.dms};
    if (cur && !rooms[cur] && loaded.rooms && loaded.dms){ toast('このルームは利用できなくなりました'); closeRoom(); }
    if (cur && rooms[cur]){ readMap[cur] = Date.now(); saveRead(); }
    renderRooms(); renderHeader();
  }, e => { console.error(col, e); toast('一覧を読み込めません（Firestoreのルールを確認してください）'); });
  unsubCols = [watch('rooms'), watch('dms')];
}

/* ---------- room list ---------- */
function renderRooms(){
  const list = $('#roomList'); if (!list) return;
  const arr = Object.values(rooms).filter(r => listFilter==='all' || (listFilter==='dm') === isDm(r))
    .sort((a,b)=> (ms(b.lastMsgTs)||ms(b.createdAt)) - (ms(a.lastMsgTs)||ms(a.createdAt)));
  list.replaceChildren();
  if (!arr.length){ list.append(h('div',{class:'empty'},'ここにはまだ何もありません。',h('br'),'「ルーム」から作成・参加、または「DM」で友だちに話しかけましょう。')); return; }
  for (const r of arr){
    const title = roomTitle(r), other = isDm(r) ? otherUid(r) : null;
    const unread = r.id !== cur && r.lastUid && r.lastUid !== me.uid && ms(r.lastMsgTs) > (readMap[r.id] || 0);
    list.append(h('button',{class:'room'+(r.id===cur?' active':'')+(unread?' unread':''),onclick:()=>openRoom(r.id)},
      avatar(other || r.createdBy || r.id, title, false, other && isOnline(other)),
      h('div',{class:'meta'},
        h('div',{class:'top'}, h('div',{class:'name'},title), h('div',{class:'time'},fmtList(r.lastMsgTs))),
        h('div',{class:'last'}, r.lastMsg || (isDm(r) ? 'メッセージを送ってみましょう' : (r.desc || 'ルームID: '+r.id)))),
      unread ? h('span',{class:'dot','aria-label':'未読'}) : null));
  }
}

/* ---------- chat pane ---------- */
function openRoom(id){
  if (!rooms[id]) return;
  if (cur === id){ document.body.classList.add('in-chat'); return; }
  unsubMsgs?.(); pendingRead.clear(); replyTo = null;
  cur = id; readMap[id] = Date.now(); saveRead();
  document.body.classList.add('in-chat');
  $('#main').replaceChildren(
    h('div',{class:'chat-head',id:'chatHead'}),
    h('div',{id:'pinBar'}),
    h('div',{class:'msgs',id:'msgs'}),
    h('div',{class:'hint',id:'chatEmpty',hidden:true},'まだメッセージはありません。最初の一言を送ってみましょう。'),
    composer());
  renderHeader(); renderRooms();
  subscribeMessages(id);
}
function closeRoom(){
  unsubMsgs?.(); unsubMsgs = null; cur = null; pendingRead.clear(); replyTo = null;
  document.body.classList.remove('in-chat');
  $('#main')?.replaceChildren(welcome());
  renderRooms();
}
function renderHeader(){
  const head = $('#chatHead'); const r = rooms[cur]; if (!head || !r) return;
  const other = isDm(r) ? otherUid(r) : null;
  const typing = Object.entries(r.typing || {}).filter(([u,t]) => u !== me.uid && Date.now() - ms(t) < 4000).map(([u]) => nameOf(u));
  let sub, cls = 's';
  if (typing.length){ sub = typing.join('、') + 'が入力中…'; cls += ' typing'; clearTimeout(typingTimer); typingTimer = setTimeout(renderHeader, 4200); }
  else if (isDm(r)) sub = isOnline(other) ? 'オンライン' : 'オフライン';
  else sub = (r.members||[]).length + '人のメンバー' + (r.desc ? '・' + r.desc : '');
  head.replaceChildren(
    h('button',{class:'icon-btn back','aria-label':'一覧に戻る',onclick:()=>document.body.classList.remove('in-chat')}, ico('back')),
    avatar(other || r.createdBy || r.id, roomTitle(r), true, other && isOnline(other)),
    h('div',{class:'titles'}, h('div',{class:'t'},roomTitle(r)), h('div',{class:cls},sub)),
    h('button',{class:'icon-btn','aria-label':'検索',onclick:searchModal}, ico('search')),
    h('button',{class:'icon-btn','aria-label':'ルームのメニュー',onclick:e=>roomMenu(e.currentTarget)}, ico('more')));
  const pb = $('#pinBar');
  if (pb) pb.replaceChildren(...(r.pinnedMsg ? [h('div',{class:'pinbar',onclick:()=>jumpTo(r.pinnedMsgId)}, ico('pin',15), h('span',{},r.pinnedMsg))] : []));
}
function jumpTo(id){
  const el = curEls.get(id); if (!el) return toast('このメッセージは読み込まれていません');
  el.scrollIntoView({block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function roomMenu(anchor){
  const r = rooms[cur]; if (!r) return;
  const items = [];
  if (!isDm(r)){
    items.push({icon:'link',label:'共有リンクをコピー',run:()=>copy(location.origin+location.pathname+'?room='+r.id,'共有リンクをコピーしました')});
    items.push({icon:'copy',label:'ルームIDをコピー（'+r.id+'）',run:()=>copy(r.id,'ルームIDをコピーしました')});
    items.push({icon:'users',label:'メンバーを見る',run:()=>membersModal(r)});
    if (r.createdBy !== me.uid) items.push({icon:'logout',label:'ルームから退出',danger:true,run:()=>leaveRoom(r)});
    if (isAdmin(r)) items.push({icon:'image',label:r.imageAdminOnly ? '画像送信を全員に許可する' : '画像送信を管理者だけにする',run:()=>updateDoc(roomRef(r),{imageAdminOnly:!r.imageAdminOnly}).then(()=>toast(r.imageAdminOnly ? '画像送信を全員に許可しました' : '画像送信を管理者だけにしました')).catch(()=>toast('変更できませんでした'))});
    if (isAdmin(r)) items.push({icon:'trash',label:'ルームを削除',danger:true,run:()=>removeRoom(r)});
  } else items.push({icon:'trash',label:'このDMを削除',danger:true,run:()=>removeRoom(r)});
  popup(anchor, items);
}
async function copy(t, ok){ try{ await navigator.clipboard.writeText(t); toast(ok); }catch(e){ prompt('コピーしてください', t); } }
const isAdmin = (r, uid=me.uid) => r.createdBy === uid || (r.admins||[]).includes(uid);
function membersModal(r0){
  const body = h('div',{style:'display:grid;gap:4px'});
  const btn = (label, cls, fn) => h('button',{class:'btn '+cls,style:'padding:5px 12px;font-size:13px',onclick:fn}, label);
  const draw = () => {
    const r = rooms[r0.id] || r0;
    const iAmCreator = r.createdBy === me.uid, iAmAdmin = isAdmin(r);
    body.replaceChildren(...(r.members||[]).map(u => {
      const creator = u === r.createdBy, admin = isAdmin(r, u);
      const label = (creator ? '作成者' : admin ? '管理者' : '') + (isOnline(u) ? (admin?'・':'')+'オンライン' : (admin?'・':'')+'オフライン');
      const acts = [];
      if (iAmCreator && !creator) acts.push(btn(admin ? '管理者を外す' : '管理者にする', 'ghost', async()=>{
        try {
          await updateDoc(roomRef(r), {admins: admin ? arrayRemove(u) : arrayUnion(u)});
          await sysMsg(r, nameOf(u) + (admin ? 'の管理者権限を外しました' : 'を管理者にしました')).catch(()=>{});
          setTimeout(draw, 400);
        } catch(e){ toast('変更できませんでした'); }
      }));
      if (iAmAdmin && u !== me.uid && !creator && (iAmCreator || !admin)) acts.push(btn('BAN', 'danger', () => banMember(r, u, draw)));
      return h('div',{class:'urow'}, avatar(u, nameOf(u), true, isOnline(u)),
        h('div',{class:'n'}, nameOf(u), h('small',{}, label)),
        acts.length ? h('div',{style:'display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end'}, acts) : null);
    }));
    const banned = r.banned || [];
    if (iAmAdmin && banned.length){
      body.append(h('div',{style:'margin-top:10px;font-weight:700;font-size:13px;color:var(--sub)'},'BANしたメンバー'),
        ...banned.map(u => h('div',{class:'urow'}, avatar(u, nameOf(u), true, false), h('div',{class:'n'}, nameOf(u)),
          btn('解除', 'ghost', async()=>{ try { await updateDoc(roomRef(r), {banned: arrayRemove(u)}); toast('BANを解除しました'); setTimeout(draw, 400); } catch(e){ toast('解除できませんでした'); } }))));
    }
    if (iAmAdmin) body.append(h('p',{style:'font-size:12px;color:var(--sub);margin-top:8px'},'管理者は、ルームの削除とメンバーのBANができます。管理者を決められるのは作成者だけです。'));
  };
  draw();
  modal('メンバー', body);
}
async function banMember(r, u, redraw){
  if (!(await confirmBox('メンバーをBAN', nameOf(u) + 'さんをこのルームから外して、もう入れないようにします。', 'BANする'))) return;
  try {
    await sysMsg(r, nameOf(u) + 'がBANされました').catch(()=>{});
    const upd = {members: arrayRemove(u), banned: arrayUnion(u)};
    if ((r.admins||[]).includes(u)) upd.admins = arrayRemove(u);
    await updateDoc(roomRef(r), upd);
    toast('BANしました'); setTimeout(redraw, 500);
  } catch(e){ console.error(e); toast('BANできませんでした（Firestoreのルールを確認してください）'); }
}
async function sysMsg(r, text){ await addDoc(msgCol(r), {type:'system', text, ts:serverTimestamp(), readBy:[], reactions:{}}); }

async function removeRoom(r){
  const dm = isDm(r);
  if (!(await confirmBox(dm ? 'DMを削除' : 'ルームを削除', dm ? 'このDMの履歴がすべて消えます。相手側からも消えます。' : 'ルームとメッセージがすべて消えます。メンバー全員から見えなくなります。', '削除する'))) return;
  if (cur === r.id) closeRoom();
  try {
    for (;;){
      const s = await getDocs(query(msgCol(r), limit(400)));
      if (s.empty) break;
      const b = writeBatch(db); s.docs.forEach(d => b.delete(d.ref)); await b.commit();
    }
    await deleteDoc(roomRef(r));
    toast('削除しました');
  } catch(e){ console.error(e); toast('削除できませんでした（ルールの設定を確認してください）'); }
}
async function leaveRoom(r){
  if (!(await confirmBox('ルームから退出', '「'+roomTitle(r)+'」から退出します。ルームIDがあれば、またいつでも入れます。', '退出する'))) return;
  if (cur === r.id) closeRoom();
  try { await sysMsg(r, myName()+'が退出しました').catch(()=>{}); await updateDoc(roomRef(r), {members: arrayRemove(me.uid)}); toast('退出しました'); }
  catch(e){ console.error(e); toast('退出できませんでした'); }
}

/* ---------- messages (incremental rendering) ---------- */
function subscribeMessages(id){
  const r0 = rooms[id];
  const els = curEls = new Map(); msgCache = new Map();
  let first = true;
  const q = query(msgCol(r0), orderBy('ts','asc'), limitToLast(300));
  unsubMsgs = onSnapshot(q, snap => {
    if (cur !== id) return;
    const box = $('#msgs'); if (!box) return;
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
    let mineAdded = false;
    snap.docChanges().forEach(ch => {
      const mid = ch.doc.id, m = ch.doc.data({serverTimestamps:'estimate'});
      if (ch.type === 'removed'){ els.get(mid)?.remove(); els.delete(mid); msgCache.delete(mid); pendingRead.delete(mid); return; }
      msgCache.set(mid, m);
      if (ch.type === 'modified' && ch.oldIndex === ch.newIndex && els.get(mid)){
        const open = els.get(mid).classList.contains('open');
        const el = msgEl(mid, m); if (open) el.classList.add('open');
        els.get(mid).replaceWith(el); els.set(mid, el);
      } else {
        els.get(mid)?.remove();
        const el = msgEl(mid, m); els.set(mid, el);
        box.insertBefore(el, box.children[ch.newIndex] || null);
        if (ch.type === 'added' && m.author === me.uid) mineAdded = true;
      }
      if (m.type !== 'system' && m.author !== me.uid && !(m.readBy||[]).includes(me.uid)) pendingRead.add(mid);
    });
    const empty = $('#chatEmpty'); if (empty) empty.hidden = box.children.length > 0;
    if (first || nearBottom || mineAdded) box.scrollTop = box.scrollHeight;
    first = false;
    readMap[id] = Date.now(); saveRead();
    flushRead();
  }, e => { console.error('msgs', e); toast('メッセージを読み込めません'); });
}
async function flushRead(){
  const r = rooms[cur];
  if (document.hidden || !r || !pendingRead.size) return;
  const ids = [...pendingRead]; pendingRead.clear();
  try {
    const b = writeBatch(db);
    ids.forEach(mid => b.update(doc(db, r.col, r.id, 'messages', mid), {readBy: arrayUnion(me.uid)}));
    await b.commit();
  } catch(e){ /* a message may have vanished */ }
}
function linkify(t){
  const out = []; const re = /(https?:\/\/[^\s<]+)/g; let last = 0, m;
  while ((m = re.exec(t))){
    if (m.index > last) out.push(t.slice(last, m.index));
    out.push(h('a',{href:m[1],target:'_blank',rel:'noopener noreferrer'},m[1]));
    last = m.index + m[0].length;
  }
  if (last < t.length) out.push(t.slice(last));
  return out;
}
function msgEl(id, m){
  if (m.type === 'system') return h('div',{class:'sys','data-id':id}, m.text);
  const mine = m.author === me.uid, r = rooms[cur];
  const el = h('div',{class:'msg'+(mine?' mine':''),'data-id':id});
  if (!mine && r && !isDm(r)) el.append(h('div',{class:'who'}, nameOf(m.author)));
  if (m.replyToText && !m.deleted) el.append(h('div',{class:'quote'}, m.replyToText));
  const toggle = () => {
    if (m.deleted) return;
    document.querySelectorAll('.msg.open').forEach(x => x !== el && x.classList.remove('open'));
    el.classList.toggle('open');
  };
  const stamp = m.stamp && !m.deleted;
  const pic = !m.deleted && m.hasImage && typeof m.image === 'string' && m.image.startsWith('data:image/');
  el.append(h('div',{class:'bubble'+(stamp?' stamp':'')+(pic?' imgb':'')+(m.deleted?' deleted':''),title:m.ts?new Date(ms(m.ts)).toLocaleString('ja-JP'):'',onclick:toggle},
    m.deleted ? 'メッセージは削除されました' : pic ? h('img',{class:'pic',src:m.image,alt:'送信された画像',loading:'lazy'}) : stamp ? m.text : linkify(m.text || '')));
  if (!m.deleted){
    const rc = h('div',{class:'reacts'});
    Object.entries(m.reactions || {}).forEach(([e, list]) => {
      if (list && list.length) rc.append(h('button',{class:'chip'+(list.includes(me.uid)?' on':''),'aria-label':'リアクション '+e,onclick:()=>react(id,e,list.includes(me.uid))}, e+' '+list.length));
    });
    if (rc.children.length) el.append(rc);
    const act = (icon, label, fn, cls) => h('button',{class:cls||'','aria-label':label,title:label,onclick:ev=>{ ev.stopPropagation(); el.classList.remove('open'); fn(); }}, ico(icon,17));
    const bar = h('div',{class:'bar'},
      REACTIONS.map(e => h('button',{'aria-label':'リアクション '+e,onclick:ev=>{ ev.stopPropagation(); el.classList.remove('open'); react(id,e,(m.reactions?.[e]||[]).includes(me.uid)); }}, e)),
      h('span',{class:'sp'}),
      act('reply','返信',()=>setReply(id, m.hasImage ? '画像' : m.text)),
      pic ? act('search','拡大',()=>lightbox(m.image)) : null,
      mine && !m.stamp && !m.hasImage ? act('edit','編集',()=>editMsg(id,m)) : null,
      r && !isDm(r) ? act('pin', r.pinnedMsgId===id ? 'ピン解除' : 'ピン留め',()=>togglePin(id,m)) : null,
      mine ? act('trash','削除',()=>deleteMsg(id),'del') : null);
    el.append(bar);
  }
  const others = (m.readBy||[]).filter(u => u !== m.author).length;
  el.append(h('div',{class:'info'}, fmtTime(m.ts), m.edited && !m.deleted ? '編集済み' : null, mine && others && !m.deleted ? (r && isDm(r) ? '既読' : '既読 '+others) : null));
  return el;
}

function composer(){
  const ta = h('textarea',{id:'msgInput',rows:'1',placeholder:'メッセージを入力','aria-label':'メッセージ'});
  const sendBtn = h('button',{class:'icon-btn send','aria-label':'送信',disabled:true}, ico('send'));
  const panel = h('div',{class:'stamps',id:'stamps'});
  const cats = Object.keys(STAMPS); let active = cats[0];
  const drawPanel = () => panel.replaceChildren(
    h('div',{class:'stab'}, cats.map(c => h('button',{class:c===active?'on':'',onclick:e=>{ e.stopPropagation(); active=c; drawPanel(); }}, c))),
    h('div',{class:'sgrid'}, STAMPS[active].split(' ').map(s => h('button',{'aria-label':'スタンプ '+s,onclick:e=>{ e.stopPropagation(); doSend('stamp', s); panel.classList.remove('show'); }}, s))));
  drawPanel();
  const stampBtn = h('button',{class:'icon-btn',id:'stampBtn','aria-label':'スタンプ',onclick:e=>{ e.stopPropagation(); panel.classList.toggle('show'); }}, ico('smile',24));
  const fileIn = h('input',{type:'file',accept:'image/*',hidden:true,onchange:e=>{ const f = e.target.files[0]; e.target.value=''; if (f) sendImage(f); }});
  const imgBtn = h('button',{class:'icon-btn','aria-label':'画像を送る',onclick:()=>{ const r = rooms[cur]; if (r && !isDm(r) && r.imageAdminOnly && !isAdmin(r)) return toast('このルームでは、画像を送れるのは管理者だけです'); fileIn.click(); }}, ico('image',24));
  ta.addEventListener('paste', e => { const f = [...(e.clipboardData?.files||[])].find(x => x.type.startsWith('image/')); if (f){ e.preventDefault(); sendImage(f); } });
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight,140) + 'px'; sendBtn.disabled = !ta.value.trim(); };
  const submit = () => { const t = ta.value; if (!t.trim()) return; ta.value = ''; fit(); doSend('text', t); if (!isMobile) ta.focus(); };
  ta.addEventListener('input', () => { fit(); sendTyping(); });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isMobile){ e.preventDefault(); submit(); } });
  ta.addEventListener('focus', () => panel.classList.remove('show'));
  sendBtn.addEventListener('click', submit);
  const rb = h('div',{class:'replybar',id:'replyBar',hidden:true});
  return h('div',{class:'composer'}, panel, rb, h('div',{class:'crow'}, stampBtn, imgBtn, fileIn, ta, sendBtn));
}
async function doSend(kind, text){
  text = String(text).trim(); const r = rooms[cur]; if (!text || !r) return;
  const data = {author:me.uid, text, ts:serverTimestamp(), readBy:[me.uid], reactions:{}};
  if (kind === 'stamp') data.stamp = true;
  if (replyTo){ data.replyTo = replyTo.id; data.replyToText = replyTo.text; replyTo = null; drawReply(); }
  try {
    await addDoc(msgCol(r), data);
    pushRelay(r, kind==='stamp' ? 'スタンプ '+text : text);
    updateDoc(roomRef(r), {lastMsg: kind==='stamp' ? 'スタンプ '+text : text.slice(0,80), lastMsgTs:serverTimestamp(), lastUid:me.uid, ['typing.'+me.uid]:null}).catch(()=>{});
  } catch(e){ console.error(e); toast('送信できませんでした'); }
}
function lightbox(src){
  const ov = h('div',{class:'lb',onclick:()=>ov.remove()}, h('img',{src,alt:'拡大した画像'}));
  document.body.append(ov);
}
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('load')); i.src = url; });
    let max = 1280, q = 0.78;
    for (let n = 0; n < 6; n++){
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const out = c.toDataURL('image/jpeg', q);
      if (out.length <= 650000) return out;
      max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.08);
    }
    throw new Error('too big');
  } finally { URL.revokeObjectURL(url); }
}
async function sendImage(file){
  const r = rooms[cur]; if (!r) return;
  if (!isDm(r) && r.imageAdminOnly && !isAdmin(r)) return toast('このルームでは、画像を送れるのは管理者だけです');
  if (!file.type.startsWith('image/')) return toast('画像ファイルを選んでください');
  toast('画像を準備しています…');
  let dataUrl;
  try { dataUrl = await compressImage(file); } catch(e){ return toast('この画像は読み込めませんでした'); }
  const data = {author:me.uid, text:'', image:dataUrl, hasImage:true, ts:serverTimestamp(), readBy:[me.uid], reactions:{}};
  if (replyTo){ data.replyTo = replyTo.id; data.replyToText = replyTo.text; replyTo = null; drawReply(); }
  try {
    await addDoc(msgCol(r), data);
    pushRelay(r, '画像を送信しました');
    updateDoc(roomRef(r), {lastMsg:'画像を送信しました', lastMsgTs:serverTimestamp(), lastUid:me.uid}).catch(()=>{});
  } catch(e){ console.error(e); toast('画像を送信できませんでした'); }
}
async function pushRelay(r, text){
  if (!PUSH_URL) return;
  try {
    const idToken = await me.getIdToken();
    fetch(PUSH_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({idToken, col:r.col, roomId:r.id, text})}).catch(()=>{});
  } catch(e){}
}

function waitOpen(id){ let n = 0; const t = setInterval(()=>{ if (rooms[id]){ clearInterval(t); openRoom(id); } else if (++n > 40) clearInterval(t); }, 150); }
async function createRoom(name, desc){
  try {
    let code, tries = 0;
    do { code = String(Math.floor(100000 + Math.random()*900000)); if (!(await getDoc(doc(db,'rooms',code))).exists()) break; } while (++tries < 10);
    await setDoc(doc(db,'rooms',code), {id:code, name, desc, members:[me.uid], createdBy:me.uid, createdAt:serverTimestamp(), lastMsg:'', lastMsgTs:serverTimestamp()});
    await addDoc(collection(db,'rooms',code,'messages'), {type:'system', text:myName()+'がルームを作成しました', ts:serverTimestamp(), readBy:[], reactions:{}});
    waitOpen(code); return true;
  } catch(e){ console.error(e); toast('ルームを作成できませんでした（ルールを確認してください）'); return false; }
}
async function joinByCode(input){
  let id = String(input).trim();
  try { const u = new URL(id); id = u.searchParams.get('room') || u.searchParams.get('join') || id; } catch(e){}
  id = id.replace(/\s/g,'');
  try {
    const snap = await getDoc(doc(db,'rooms',id));
    if (!snap.exists()){ toast('そのルームは見つかりません'); return false; }
    const room = snap.data();
    if ((room.banned||[]).includes(me.uid)){ toast('このルームには参加できません'); return false; }
    if (!(room.members||[]).includes(me.uid)){
      await updateDoc(doc(db,'rooms',id), {members: arrayUnion(me.uid)});
      await addDoc(collection(db,'rooms',id,'messages'), {type:'system', text:myName()+'が参加しました', ts:serverTimestamp(), readBy:[], reactions:{}});
      toast((room.name||'ルーム')+'に参加しました');
    }
    waitOpen(id); return true;
  } catch(e){ console.error(e); toast('参加できませんでした'); return false; }
}
async function joinByInvite(invId){
  try {
    const snap = await getDoc(doc(db,'invites',invId));
    if (!snap.exists()) return toast('招待リンクが無効です');
    const inv = snap.data();
    if (inv.expiresAt?.toDate && inv.expiresAt.toDate() < new Date()) return toast('招待リンクの期限が切れています');
    await joinByCode(inv.roomId);
  } catch(e){ console.error(e); toast('招待リンクを開けませんでした'); }
}

/* ---------- notifications ---------- */
async function notify(r){
  const body = r.lastMsg || '新しいメッセージ';
  if (!document.hidden){ toast(roomTitle(r) + ': ' + body.slice(0,30)); return; }
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = {body, icon:'icon-192.png?v=2', badge:'icon-192.png?v=2', tag:r.id, renotify:true, data:{url:'/chat-app/?room='+r.id}};
  try {
    const reg = await navigator.serviceWorker?.ready;
    if (reg) await reg.showNotification(roomTitle(r), opts);
    else new Notification(roomTitle(r), opts);
  } catch(e){}
}

  b.replaceChildren();
  if (!('Notification' in window)){
    if (isIos && !isStandalone && !localStorage.getItem('cs_nb_ios')) b.append(h('div',{class:'nbanner'}, h('span',{},'通知を使うには、共有ボタンから「ホーム画面に追加」して、そのアプリから開いてください。'), h('button',{class:'icon-btn',style:'width:30px;height:30px','aria-label':'閉じる',onclick:()=>{ localStorage.setItem('cs_nb_ios','1'); drawBanner(); }}, ico('x',16))));
    return;
  }
  if (Notification.permission !== 'default') return;
  b.append(h('div',{class:'nbanner'}, ico('bell',18), h('span',{},'新着メッセージの通知を受け取れます'),
    h('button',{class:'btn',onclick:()=>setupPush(true)},'オンにする')));
}
function autoNotify(){
  drawBanner();
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted'){ setupPush(false); return; }
  if (Notification.permission !== 'default') return;
  // ブラウザの決まりで、許可の確認は画面をタップしたときにしか出せません。最初のタップで自動的に確認を出します。
  if (isIos && !isStandalone) return;
  const once = () => { document.removeEventListener('pointerdown', once, true); if (Notification.permission === 'default') setupPush(true); };
  document.addEventListener('pointerdown', once, true);
}
let pushDone = false;
async function setupPush(interactive){
  if (!('Notification' in window) || !('serviceWorker' in navigator)){ if (interactive) toast('このブラウザは通知に対応していません（iPhoneはホーム画面に追加すると使えます）'); return; }
  let perm = Notification.permission;
  if (perm === 'default' && interactive) perm = await Notification.requestPermission();
  drawBanner();
  if (perm !== 'granted'){ if (interactive && perm === 'denied') toast('通知がブロックされています。ブラウザの設定から許可してください'); return; }
  if (pushDone){ if (interactive) toast('通知はオンです'); return; }
  try {
    const { getMessaging, getToken } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js');
    const reg = await navigator.serviceWorker.ready;
    const token = await getToken(getMessaging(fb), {vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    if (token) await updateDoc(doc(db,'users',me.uid), {fcmTokens: arrayUnion(token)});
    pushDone = true;
    if (interactive) toast('通知をオンにしました');
  } catch(e){ console.warn('push', e); if (interactive) toast('通知の設定に失敗しました'); }
}
</script>
